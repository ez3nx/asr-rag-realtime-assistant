line-length = 100
target-version = "py312"

# Исключаем виртуальное окружение из проверки
exclude = ["venv"]

[lint]
# Включаем базовые наборы правил:
# E — ошибки стиля (pycodestyle)
# F — ошибки анализа кода (pyflakes)
# I — сортировка импортов (isort-совместимые правила)
select = ["E", "F", "I"]

# Пример игнорируемых правил (пока закомментировано).
# Можно раскомментировать по мере появления кода и желания смягчить проверки.
#
# ignore = [
#   "E501",  # длина строки > line-length
# ]
